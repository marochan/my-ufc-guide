<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFC 観戦ガイド | marochan</title>
    <!-- Markdown変換ライブラリの読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #181b22;
            --text-color: #e6edf3;
            --text-muted: #8b949e;
            --accent-red: #d20a0a;
            --border-color: #30363d;
            --highlight-bg: #21262d;
            --link-color: #58a6ff;
        }
        body {
            margin: 0;
            padding: 16px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        /* Markdownから変換される要素のデザイン */
        h1 {
            font-size: 1.5rem;
            border-bottom: 2px solid var(--accent-red);
            padding-bottom: 8px;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 1.3rem;
            color: var(--accent-red);
            margin-top: 30px;
        }
        h3 {
            font-size: 1.1rem;
            background-color: var(--highlight-bg);
            padding: 8px 12px;
            border-left: 4px solid var(--accent-red);
            border-radius: 0 4px 4px 0;
            margin-top: 24px;
        }
        h4 {
            font-size: 1.2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-top: 32px;
        }
        p {
            font-size: 0.9rem;
            margin-bottom: 16px;
        }
        a {
            color: var(--link-color);
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        strong {
            color: #fff;
            font-weight: bold;
        }
        ul, ol {
            font-size: 0.9rem;
            padding-left: 20px;
            margin-bottom: 16px;
        }
        li {
            margin-bottom: 6px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            margin: 16px 0;
            background-color: var(--card-bg);
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            text-align: center;
        }
        th {
            background-color: var(--highlight-bg);
            color: var(--text-muted);
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }
        .error {
            color: var(--accent-red);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container" id="content">
    <p style="text-align:center; color:#8b949e; margin-top:50px;">記事を読み込み中...</p>
</div>

<script>
    // content.md ファイルを読み込んでMarkdownをHTMLに変換する処理
    fetch('content.md')
        .then(response => {
            if (!response.ok) {
                throw new Error('原稿ファイル(content.md)が見つかりません。');
            }
            return response.text();
        })
        .then(text => {
            document.getElementById('content').innerHTML = marked.parse(text);
        })
        .catch(error => {
            document.getElementById('content').innerHTML = `<p class="error">${error.message}<br>GitHub上に content.md を作成してください。</p>`;
        });
</script>

</body>
</html>
